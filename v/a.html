<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preloved Louis Vuitton, Tokyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f0e4;--paper:#fbf8f1;--ink:#1d1a16;--mute:#6d6558;--line:#d9cfbb;--gold:#9a7a3c;--lv:#5b3a1e;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ivory);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:hidden}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.mast{padding:44px 0 28px;text-align:center;border-bottom:1px solid var(--ink)}
.kick{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font:italic 500 clamp(34px,10vw,56px)/1.05 var(--serif);margin:14px 0}
.intro{font-family:var(--serif);font-size:20px;line-height:1.5;color:#3a352d;text-align:left;margin-top:20px}
.intro::first-letter{font-size:3.2em;float:left;line-height:.85;padding:4px 8px 0 0;color:var(--gold)}
.by{font-size:12px;color:var(--mute);margin-top:14px;letter-spacing:.06em}
.toc{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;margin:0 -16px}
.toc a{flex:none;text-decoration:none;font-size:13px;font-weight:500;border:1px solid var(--ink);border-radius:99px;padding:10px 16px;min-height:44px;display:flex;align-items:center}
.ch{padding:48px 0 8px}
.hero{margin:0 -16px;position:relative}
.hero img{width:100%;height:56vw;max-height:380px;object-fit:cover;display:block;background:var(--line)}
.num{font:italic 500 88px/1 var(--serif);color:var(--c);opacity:.9;margin-top:18px}
h2{font:500 clamp(32px,9vw,46px)/1.05 var(--serif);margin-top:2px}
.train{display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:12px 14px;background:var(--paper);border-left:3px solid var(--c);font-size:15px;font-weight:500}
.train b{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.why{font-family:var(--serif);font-size:19px;line-height:1.5;color:#3a352d}
.plan{font-size:14px;color:var(--mute);margin-top:12px}.plan b{color:var(--ink)}
.sec{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:32px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:44px 1fr;gap:0 4px;padding:20px 0;border-bottom:1px solid var(--line)}
.en{font:italic 500 32px/1 var(--serif);color:var(--c)}
.entry h3{font:600 24px/1.15 var(--serif)}
.lv{display:inline-block;margin:8px 0 2px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--lv);color:#f6e7c8;padding:4px 10px;border-radius:2px}
.entry p{font-size:15px;margin-top:6px;color:#3a352d}
.addr{font-size:13px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:15px;border-radius:2px;flex:1 1 180px}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ink);flex:0 1 auto;font-weight:500;font-size:13px}
.rest{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--gold);padding:6px 16px 8px;margin-top:36px}
.rest h4{font:italic 500 30px/1.1 var(--serif);margin-top:12px}
.rest .sub{font-size:13px;color:var(--mute)}
.r{padding:16px 0;border-top:1px solid var(--line);margin-top:12px}.r:first-of-type{border-top:0}
.kind{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.r h3{font:600 21px/1.2 var(--serif);margin-top:2px}
.tips{margin-top:56px;border-top:1px solid var(--ink);padding-top:8px}
.tips h2{font-size:34px;margin-top:20px}
.tips h3{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:22px 0 6px}
.tips li{margin:0 0 10px 18px;font-size:15px}
footer{margin-top:48px;padding:24px 0 48px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
footer p+p{margin-top:6px}
@media(min-width:700px){.hero{margin:0}.toc{margin:0;padding:14px 0}.entry{grid-template-columns:64px 1fr}.rest{padding:6px 24px 10px}}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const A=(href,c,t,label)=>{const a=$('a',c,t);a.href=href;a.target='_blank';a.rel='noopener';if(label)a.setAttribute('aria-label',label);return a};
fetch('../content.json').then(r=>r.json()).then(d=>{
const app=document.getElementById('app'),m=$('header','mast');
document.title=d.title;
m.append($('div','kick','A guide for Karina'),$('h1',0,d.title),$('p','intro',d.intro),$('p','by','From '+d.from+' · Updated '+d.updated));
const toc=$('nav','toc');d.areas.forEach(a=>toc.append(A('#'+a.id,0,a.num+'  '+a.name)));toc.lastChild&&toc.querySelectorAll('a').forEach(x=>{x.removeAttribute('target')});
app.append(m,toc);
d.areas.forEach(a=>{
 const s=$('section','ch');s.id=a.id;s.style.setProperty('--c',a.color);
 const h=$('figure','hero'),i=$('img');i.src=a.photo.url;i.alt=a.photo.caption;i.loading='lazy';h.append(i);
 const tr=$('div','train');const tb=$('div');tb.append($('b',0,'From Shinjuku'),document.createTextNode(a.from_shinjuku));tr.append(tb);
 s.append(h,$('div','num',a.num),$('h2',0,a.name),tr,$('p','why',a.why),(p=>{p.innerHTML='<b>Plan · </b>';p.append(a.plan);return p})($('p','plan')));
 const shops=a.places.filter(p=>p.type==='shop'),rests=a.places.filter(p=>p.type!=='shop');
 s.append($('div','sec','The shops'));
 shops.forEach((p,n)=>{
  const e=$('article','entry');e.append($('div','en',String(n+1).padStart(2,'0')));
  const b=$('div');b.append($('h3',0,p.name));
  if(p.lv)b.append($('span','lv','Louis Vuitton listed'));
  b.append($('p',0,p.text),$('p','addr',p.address));
  const x=$('div','acts');x.append(A(p.map,'btn','Open in Google Maps'),A(p.source,'btn o','Shop website'));b.append(x);e.append(b);s.append(e);
 });
 if(rests.length){const r=$('aside','rest');r.append($('h4',0,'Rest stop'),$('p','sub','For the moms, when the shopping needs a pause.'));
  rests.forEach(p=>{const q=$('div','r');q.append($('div','kind',p.kind),$('h3',0,p.name),$('p',0,p.text),$('p','addr',p.address));
   const x=$('div','acts');x.append(A(p.map,'btn','Open in Google Maps'),A(p.source,'btn o','Website'));q.append(x);r.append(q)});
  s.append(r)}
 app.append(s)});
const t=$('section','tips');t.append($('div','kick','Good to know'),$('h2',0,'Before you buy'));
t.append($('h3',0,'Louis Vuitton'));let u=$('ul');d.tips.lv.forEach(x=>u.append($('li',0,x)));t.append(u);
t.append($('h3',0,'Shopping in general'));u=$('ul');d.tips.general.forEach(x=>u.append($('li',0,x)));t.append(u);
const f=$('footer');f.append($('p',0,'Photos'));
d.areas.forEach(a=>{const p=$('p');p.append(a.name+': '+a.photo.author+', '+a.photo.license+' · ');p.append(A(a.photo.page,0,'source'));f.append(p)});
f.append($('p',0,'Map coordinates are approximate; use the Google Maps buttons.'));
app.append(t,f);
}).catch(e=>{document.getElementById('app').textContent='Could not load the guide.'});
</script></body></html>
