<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karinaガイド 5案比較</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f4f1ea;--ink:#1a1a1a;--mute:#6b665c;--acc:#8a6a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans",sans-serif}
header{padding:14px 16px 6px}h1{font-size:18px;margin:0 0 4px}header p{margin:0;color:var(--mute);font-size:13px}
.tabs{display:none;gap:6px;padding:8px 16px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{border:1.5px solid var(--ink);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.row{display:flex;gap:18px;padding:12px 16px 24px;overflow-x:auto}
.pane{flex:none;width:392px}
.pane h2{font-size:15px;margin:0 0 2px}.pane p{font-size:12px;color:var(--mute);margin:0 0 8px;min-height:32px}
.pane a{font-size:12px;color:var(--acc)}
.frame{width:392px;height:calc(100vh - 150px);min-height:600px;border:1px solid #cfc9bc;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.08)}
iframe{width:390px;height:100%;border:0;display:block}
@media (max-width:700px){.tabs{display:flex}.row{display:block;padding:8px 16px}.pane{display:none;width:100%}.pane.on{display:block}
.frame{width:100%;height:calc(100vh - 190px)}iframe{width:100%}}
</style></head><body>
<header><h1>Karinaさんガイド 5案比較</h1><p>中身は5案とも同じ（content.json）。違うのは骨組みとデザインだけ。各枠の中はそのままスクロール・タップできます。</p></header>
<nav class="tabs" id="tabs"></nav>
<div class="row" id="row"></div>
<script>
const V=[["a","A 高級旅行誌型","章立て・大きな写真・明朝見出し。いちばん上品"],["b","B アプリ型","Shop LV / Rest / Tips のタブとエリア絞り込み。いちばん短く操作しやすい"],["c","C 地図が主役","色分けピンと一覧が連動。新宿のホテル周辺を丸で囲む"],["d","D 比較型","エリアごとの所要時間・店数・休憩数。LV listed で選びやすい"],["e","E 1日プラン型","朝は新宿→休憩→午後に遠出。いちばん親しみやすい"]];
const row=document.getElementById('row'),tabs=document.getElementById('tabs');
V.forEach(([k,t,d],i)=>{
 row.insertAdjacentHTML('beforeend',`<section class="pane${i?'':' on'}" id="p${k}"><h2>${t}</h2><p>${d}　<a href="${k}.html" target="_blank" rel="noopener">単体で開く ↗</a></p><div class="frame"><iframe src="${k}.html" title="${t}" loading="${i<3?'eager':'lazy'}"></iframe></div></section>`);
 tabs.insertAdjacentHTML('beforeend',`<button class="${i?'':'on'}" data-k="${k}">${t.split(' ')[0]}</button>`);
});
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 row.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p'+b.dataset.k));});
</script></body></html>
